[package]
name = "airlift"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "airlift"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
plist = "1.7"
zip = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
byteorder = "1.5"
